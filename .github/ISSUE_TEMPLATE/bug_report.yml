name: Bug report / 缺陷报告
description: Report a reproducible InkSight-GLHF problem without private data.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, Wi-Fi/cloud credentials, databases, real MAC addresses, private paths, or unsanitized logs. Sensitive vulnerabilities must follow SECURITY.md, not this public form.
  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Backend or web console / 后端或管理端
        - AI Usage panel / AI 用量页
        - Today panel / 今日关注页
        - Firmware build / 固件构建
        - Device flash or runtime / 设备刷写或运行
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem / 问题
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Project tag/commit, host OS/architecture, Python version, board, display, and firmware environment. Replace device identifiers with placeholders.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 脱敏证据
      description: Short logs, screenshots, or test output with all private data removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私检查
      options:
        - label: I removed secrets, account data, databases, real MAC addresses, Wi-Fi details, private paths, and sensitive vulnerability details.
          required: true
        - label: I checked the current support matrix and marked any unverified hardware or operating system.
          required: true
