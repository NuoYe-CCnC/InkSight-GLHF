# ── 微雪4.26" 800x480 SSD1677 BW 面板 · ESP32-S3（官方套件，32MB Octal Flash / Octal PSRAM）──
# ⚠️ 实机 eFuse = octal(8线) flash：必须 memory_type=opi_opi + 80MHz，
#    否则 qio bootloader 无法初始化 octal flash（do_core_init flash_ret!=ESP_OK 重启循环）。
#    平台会自动选用预编译 bootloader_opi_80m.elf（见 tools/platformio-build.py:92）。
[env:epd_426_ssd1677_s3_n32r16]
extends = common
board = esp32-s3-devkitc-1
upload_speed = 460800
board_build.flash_mode = opi
board_build.f_flash = 80000000L
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi
board_build.partitions = partitions/inksight_32mb_ota.csv
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
lib_deps =
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -DBOARD_PROFILE_YD_ESP32_S3_N16R8
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DEPD_WIDTH=800
    -DEPD_HEIGHT=480
    -DEPD_PANEL_42_6_SSD1677
    -DENABLE_STRUCTURED=1
    ; 临时验收构建：串口导出两页帧（no-image 对比用；验收后移除）
    ; 验收构建开关：-DFB_DUMP=1 时串口导出双页帧（正式交付版当前关闭）
    ; BLE 触发（休眠态默认扫 2s/60s，收到广播即拉）：v4 起启用
    ; -DENABLE_BLE_TRIGGER=1  (实验后默认关闭：触发链路端到端未验证；恢复指引见 docs/BLE触发恢复-实验结果汇总-2026-09-04.md)
    -DDEFAULT_SSID='"${sysenv.INK_SSID}"'
    -DDEFAULT_PASS='"${sysenv.INK_PASS}"'
    -DDEFAULT_SERVER='"${sysenv.INK_SERVER}"'
    ; 云端模式（坚果云）：设了 CLOUD_BASE_URL 后设备改为直接 GET <BASE>/<MAC>.json（Basic Auth）
    ; 一键入口：./one-click.sh cloud（会收集参数并 export 后再调用 pio.sh）
    -DCLOUD_BASE_URL='"${sysenv.CLOUD_BASE_URL}"'
    -DCLOUD_USER='"${sysenv.CLOUD_USER}"'
    -DCLOUD_PASS='"${sysenv.CLOUD_PASS}"'
    ; 编译期预置多个备用网络（家+公司），格式 "SSID2~PASS2^SSID3~PASS3"（'~'字段、'^'记录；SSID/密码避免这些与 | ; 引号）
    -DEXTRA_WIFI='"${sysenv.INK_EXTRA_WIFI}"'
    -DINKSIGHT_BUILD_ID='"${sysenv.INKSIGHT_BUILD_ID}"'
    -DALLOW_INSECURE_FALLBACK=0
